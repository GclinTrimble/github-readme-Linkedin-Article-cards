name: Update LinkedIn cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - cards.config.json
      - scripts/**
      - card/**
      - app.py
      - action.yml

permissions:
  contents: write

concurrency:
  group: update-linkedin-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Dogfood our own reusable action against the committed config.
      - uses: ./
        with:
          config_file: cards.config.json

      - name: Commit updated cards
        run: |
          if [ -n "$(git status --porcelain assets README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets README.md
            git commit -m "chore: refresh LinkedIn article cards"
            git push
          else
            echo "No card changes to commit."
          fi

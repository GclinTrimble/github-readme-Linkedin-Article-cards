name: Update LinkedIn cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - cards.config.json
      - scripts/generate_cards.py
      - card/**
      - app.py

permissions:
  contents: write

concurrency:
  group: update-linkedin-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render cards
        run: python scripts/generate_cards.py

      - name: Commit updated assets
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: refresh LinkedIn article cards"
            git push
          else
            echo "No card changes to commit."
          fi
